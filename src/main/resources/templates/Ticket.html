<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Tickets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #f8f9fa, #e9ecef);
            /* Thêm background gradient */
            font-family: 'Segoe UI', sans-serif;
        }

        .ticket-header {
            background-color: #30003a;
            color: white;
            padding: 2rem;
            text-align: center;
            border-radius: 12px;
            /* Thêm border radius để mềm mại hơn */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            /* Thêm bóng đổ */
            margin-bottom: 2rem;
            /* Khoảng cách dưới */
        }

        .match-info {
            max-width: 900px;
            background-color: #ffffff;
            margin: 1rem auto;
            padding: 1.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            /* Thêm bóng đổ */
            background-color: #fff;
        }

        .match-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .team {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .team img {
            width: 40px;
            height: 40px;
            object-fit: contain;
            border-radius: 50%;
            background-color: #eee;
        }

        .score {
            font-weight: bold;
            font-size: 2rem;
            color: #30003a;
        }

        .stadium-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 2rem;
            padding: 1rem;
        }

        canvas {
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
        }

        .legend {
            min-width: 200px;
            padding: 1rem;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.08);
        }

        .legend-item {
            display: block;
            margin: 10px 0;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.95rem;
            color: #fff;
            font-weight: 500;
        }

        .area-A {
            background-color: #f94144;
        }

        .area-B {
            background-color: #f3722c;
        }

        .area-C {
            background-color: #f9c74f;
            color: #000;
        }

        .area-D {
            background-color: #90be6d;
            color: #000;
        }

        .area-E {
            background-color: #43aa8b;
        }

        .area-F {
            background-color: #577590;
        }

        .venue {
            font-size: 0.95rem;
            color: #666;
            margin-top: 1rem;
            /* Khoảng cách trên */
        }

        /* Thêm border-radius và padding cho modal */
        .modal-content {
            border-radius: 12px;
            padding: 2rem;
        }
    </style>
</head>

<body>
    <div th:replace="fragments/header :: siteHeader"></div>


    <div class="ticket-header">
        <h2 th:text="${match.matchTitle}">Match Title</h2>
        <p th:text="${#temporals.format(match.matchStartTime, 'dd MMM yyyy, HH:mm')}">Match Time</p>
    </div>

    <div class="match-info text-center">
        <div class="match-row">
            <div class="team">
                <img th:src="@{{logo}(logo=${match.matchClubStats[0].club.clubLogoPath})}" alt="Home Logo">
                <span th:text="${match.matchClubStats[0].club.clubName}">Home Club</span>
            </div>

            <div class="score"
                th:text="${match.matchClubStats[0].matchClubStatScore} + ' - ' + ${match.matchClubStats[1].matchClubStatScore}">
                1 - 2
            </div>

            <div class="team text-end">
                <span th:text="${match.matchClubStats[1].club.clubName}">Away Club</span>
                <img th:src="@{{logo}(logo=${match.matchClubStats[1].club.clubLogoPath})}" alt="Away Logo">
            </div>
        </div>
        <div class="venue mt-3" th:text="${match.matchDescription}">Venue Name</div>
        <div class="venue" th:text="${match.matchClubStats[0].club.clubStadium}">National Stadium</div>
    </div>

    

    <div class="stadium-wrapper">
        <p class="text-center text-muted">
            Nhấp vào khu vực trên sơ đồ sân vận động hoặc chọn khu bên phải để xem chi tiết vé.
        </p>
        <canvas id="stadiumCanvas" width="1000" height="700">
            
        </canvas>
       
        <div class="legend">
            <span class="legend-item area-A">Area A</span>
            <span class="legend-item area-B">Area B</span>
            <span class="legend-item area-C">Area C</span>
            <span class="legend-item area-D">Area D</span>
            <span class="legend-item area-E">Area E</span>
            <span class="legend-item area-F">Area F</span>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="ticketModal" tabindex="-1" aria-labelledby="ticketModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form method="post" action="http://localhost:8080/ticket/bookingticket">
                    <div class="modal-header">
                        <h5 class="modal-title" id="ticketModalLabel">Ticket Details</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <table class="table table-sm">
                            <tbody>
                                <tr>
                                    <th>Title</th>
                                    <td id="modalTicketTitle"></td>
                                </tr>
                                <tr>
                                    <th>Type</th>
                                    <td id="modalTicketType"></td>
                                </tr>
                                <tr>
                                    <th>Area</th>
                                    <td id="modalTicketArea"></td>
                                </tr>
                                <tr>
                                    <th>Remaining</th>
                                    <td id="modalTicketAmount"></td>
                                </tr>
                                <tr>
                                    <th>Price</th>
                                    <td id="modalTicketPrice"></td>
                                </tr>
                                <tr>
                                    <th>Note</th>
                                    <td id="modalTicketNote"></td>
                                </tr>

                            </tbody>
                        </table>
                        <input type="hidden" name="ticketId" id="hiddenTicketId">
                    </div>
                    <div id="ticketBenefits" class="mt-3">
                        <h6>Benefits:</h6>
                        <ul id="benefitsList" class="mb-0 ps-3"></ul>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">Book Now</button>
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <script th:inline="javascript">
        const tickets = JSON.parse(/*[[${ticketsJson}]]*/ '[]');

        const canvas = document.getElementById('stadiumCanvas');
        const ctx = canvas.getContext('2d');
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;

        const baseColors = {
            'A': '#f94144', 'B': '#f3722c', 'C': '#f9c74f',
            'D': '#90be6d', 'E': '#43aa8b', 'F': '#577590'
        };

        const typeShades = {
            'VIP': 0.9,
            'Standard': 1.3
        };

        const positionMap = {};

        function shadeColor(hex, factor) {
            let r = parseInt(hex.substring(1, 3), 16);
            let g = parseInt(hex.substring(3, 5), 16);
            let b = parseInt(hex.substring(5, 7), 16);
            r = Math.min(255, Math.floor(r * factor));
            g = Math.min(255, Math.floor(g * factor));
            b = Math.min(255, Math.floor(b * factor));
            return `rgb(${r}, ${g}, ${b})`;
        }

        function drawOvalStadiumField() {
            ctx.beginPath();
            ctx.ellipse(centerX, centerY, 180, 100, 0, 0, 2 * Math.PI);
            ctx.fillStyle = '#4CAF50';
            ctx.fill();
            ctx.strokeStyle = '#2e7d32';
            ctx.lineWidth = 4;
            ctx.stroke();
        }

        function drawTicketRings() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawOvalStadiumField();

            const vipTickets = tickets.filter(t => t.ticketType === 'VIP');
            const stdTickets = tickets.filter(t => t.ticketType === 'Standard');

            const drawRing = (ticketList, innerA, outerA, innerB, outerB) => {
                const step = (2 * Math.PI) / ticketList.length;
                // Nhóm theo ticketArea
                const grouped = {};
                ticketList.forEach(ticket => {
                    const area = ticket.ticketArea;
                    if (!grouped[area]) grouped[area] = [];
                    grouped[area].push(ticket);
                });

                // Vẽ từng nhóm ticketArea
                let currentAngle = 0;
                const areasOrder = ['A', 'B', 'C', 'D', 'E', 'F']; // Thứ tự cố định
                const totalAreas = areasOrder.length;
                const anglePerArea = (2 * Math.PI) / totalAreas;

                areasOrder.forEach((area, index) => {
                    const ticketsInArea = grouped[area] || [];
                    const startAngle = index * anglePerArea;
                    const endAngle = startAngle + anglePerArea;

                    const anglePerTicket = (endAngle - startAngle) / (ticketsInArea.length || 1);


                    ticketsInArea.forEach(ticket => {
                        const start = currentAngle;
                        const end = start + anglePerTicket;

                        ctx.beginPath();
                        for (let angle = start; angle <= end; angle += 0.01) {
                            const x = centerX + outerA * Math.cos(angle);
                            const y = centerY + outerB * Math.sin(angle);
                            if (angle === start) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        for (let angle = end; angle >= start; angle -= 0.01) {
                            const x = centerX + innerA * Math.cos(angle);
                            const y = centerY + innerB * Math.sin(angle);
                            ctx.lineTo(x, y);
                        }
                        ctx.closePath();

                        const baseColorKey = ticket.ticketArea;
                        const base = baseColors[baseColorKey] || '#999';
                        ctx.fillStyle = shadeColor(base, typeShades[ticket.ticketType] || 1);
                        ctx.fill();
                        ctx.strokeStyle = '#333';
                        ctx.stroke();

                        // text label
                        const mid = (start + end) / 2;
                        const labelX = centerX + ((outerA + innerA) / 2) * Math.cos(mid);
                        const labelY = centerY + ((outerB + innerB) / 2) * Math.sin(mid);
                        ctx.fillStyle = '#000';
                        ctx.font = 'bold 10px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.fillText(`${ticket.ticketType}`, labelX, labelY);

                        positionMap[ticket.ticketId] = { start, end, innerA, outerA, innerB, outerB, ticket };

                        currentAngle += anglePerTicket;
                    });
                });

            }

            drawRing(vipTickets, 120, 170, 70, 100);
            drawRing(stdTickets, 200, 260, 130, 160);
        }

        canvas.addEventListener('click', function (e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const dx = x - centerX;
            const dy = y - centerY;
            const angle = (Math.atan2(dy, dx) + 2 * Math.PI) % (2 * Math.PI);

            for (let ticketId in positionMap) {
                const pos = positionMap[ticketId];
                const xA = dx / pos.outerA;
                const yB = dy / pos.outerB;
                const r = Math.sqrt(xA * xA + yB * yB);
                if (angle >= pos.start && angle <= pos.end && r >= pos.innerA / pos.outerA && r <= 1) {
                    const t = pos.ticket;
                    showTicketModal(t);
                    break;
                }
            }
        });

        drawTicketRings();

        document.querySelectorAll('.legend-item').forEach(item => {
            item.addEventListener('click', () => {
                const area = item.textContent.split(' ')[1]; // "Area A" => "A"
                const ticket = tickets.find(t => t.ticketArea === area);
                if (ticket) {
                    showTicketModal(ticket);
                }
            });
        });

        function showTicketModal(t) {
            document.getElementById('modalTicketTitle').textContent = t.ticketTitle;
            document.getElementById('modalTicketType').textContent = t.ticketType;
            document.getElementById('modalTicketArea').textContent = t.ticketArea;
            document.getElementById('modalTicketAmount').textContent = t.ticketAmount;
            document.getElementById('modalTicketPrice').textContent = t.ticketPrice || 'N/A';
            document.getElementById('modalTicketNote').textContent = t.ticketNote || '-';
            document.getElementById('hiddenTicketId').value = t.ticketId;

            // Benefits logic
            const vipBenefits = [
                "Lối vào khu vực VIP",
                "Được phục vụ đồ ăn và nước uống miễn phí",
                "Vị trí ghế ngồi cao cấp",
                "Lối đi riêng biệt dành cho khách VIP"
            ];

            const standardBenefits = [
                "Khu vực ghế ngồi tiêu chuẩn",
                "Có thể mua đồ ăn và nước uống"
            ];


            const benefitsList = document.getElementById('benefitsList');
            benefitsList.innerHTML = ''; // clear old

            const benefits = t.ticketType === 'VIP' ? vipBenefits : standardBenefits;
            benefits.forEach(b => {
                const li = document.createElement('li');
                li.textContent = b;
                benefitsList.appendChild(li);
            });

            const modal = new bootstrap.Modal(document.getElementById('ticketModal'));
            modal.show();
        }

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
