<!-- file: templates/fragments/boxchat.html -->
<div th:fragment="chatBox">
    <div id="chatBoxWrapper" class="position-fixed bottom-0 end-0 m-4" style="width: 300px;">
        <div class="card shadow">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <span><i class="bi bi-chat-dots-fill me-2"></i> Chat Support</span>
                <button class="btn-close btn-close-white btn-sm" onclick="toggleChatBox()"></button>
            </div>
            <div class="card-body" style="max-height: 300px; overflow-y: auto;" id="chatMessages">
                <div class="text-muted small text-center">Welcome! How can we help you?</div>
            </div>
            <div class="card-footer p-2">
                <form onsubmit="sendChatMessage(event)">
                    <div class="input-group">
                        <input type="text" id="chatInput" class="form-control" placeholder="Type message..." required>
                        <button class="btn btn-primary" type="submit"><i class="bi bi-send"></i></button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- SockJS + STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2/dist/stomp.min.js"></script>

    <script>
        let stompClient = null;

        // Kết nối đến WebSocket endpoint
        function connectChat() {
            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);
            stompClient.connect({}, function (frame) {
                stompClient.subscribe('/topic/user/' + userId, function (messageOutput) {
                    const message = JSON.parse(messageOutput.body);
                    showAdminMessage(message.content, message.timestamp);
                });
            });
        }

        // Gửi tin nhắn tới server
        function sendChatMessage(event) {
            event.preventDefault();
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (message === '' || stompClient == null) return;
            const userId = 'user123';
            // Gửi tin nhắn tới /app/chat.sendMessage
            stompClient.send("/app/chat.sendToAdmin", {}, JSON.stringify({
                sender: 'User',
                content: message,
                userId: userId
            }));

            showUserMessage(message);
            input.value = '';
        }

        function showUserMessage(msg) {
            const chatMessages = document.getElementById('chatMessages');
            const element = document.createElement('div');
            element.className = 'text-end mb-2';
            element.innerHTML = `<span class="badge bg-primary">${msg}</span>`;
            chatMessages.appendChild(element);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showAdminMessage(msg, time) {
            const chatMessages = document.getElementById('chatMessages');
            const element = document.createElement('div');
            element.className = 'text-start mb-2';
            element.innerHTML = `<span class="badge bg-light text-dark">${msg} <small class="text-muted">${time}</small></span>`;
            chatMessages.appendChild(element);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function toggleChatBox() {
            const box = document.getElementById('chatBoxWrapper');
            if (box) box.remove();
        }

        window.addEventListener('load', connectChat);
    </script>
</div>
