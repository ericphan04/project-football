<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Match Results</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f2f8;
      color: #333;
    }

    .hero {
      background: linear-gradient(135deg, #4b007d, #7a1fa0);
      color: white;
      padding: 80px 20px;
      text-align: center;
      border-radius: 0 0 30px 30px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.2);
    }

    .date-section {
      background-color: #ede1f4;
      padding: 12px 20px;
      margin-top: 30px;
      border-left: 4px solid #7a1fa0;
      font-weight: 600;
      font-size: 1rem;
      color: #4b007d;
      border-radius: 8px;
    }

    .match-container {
      background-color: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      margin-bottom: 30px;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .match-container:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }

    .match-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 25px;
      border-bottom: 1px solid #eee;
      flex-wrap: wrap;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      font-size: 1.05rem;
      color: #4b007d;
    }

    .team img {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 2px solid #ddd;
      background: #fff;
      padding: 3px;
      transition: transform 0.2s;
    }

    .team img:hover {
      transform: scale(1.1);
    }

    .score {
      font-weight: bold;
      font-size: 1.6rem;
      color: #4b007d;
      margin: 10px 0;
    }

    .venue-info {
      display: flex;
      justify-content: space-between;
      padding: 12px 20px;
      background-color: #faf7fc;
      font-size: 0.95rem;
      color: #555;
      border-top: 1px solid #eee;
    }

    .venue-info span {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .match-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    /* Responsive */
    @media (max-width: 576px) {
      .match-row {
        flex-direction: column;
        gap: 10px;
        text-align: center;
      }

      .team {
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <div th:replace="fragments/header :: siteHeader"></div>

  <div class="hero">
    <h1 class="mb-1 display-4">Results</h1>
    <p class="mb-0 fs-5">Premier League - 2024/25</p>
  </div>

  <div class="container mt-4">
    <div th:each="match : ${matches}" th:if="${!#lists.isEmpty(match.matchClubStats)}">
      <a th:href="@{'/match/' + ${match.matchId}}" class="match-link">
        <div class="date-section">
          <h6 th:text="${match.matchStartTime.format(T(java.time.format.DateTimeFormatter).ofPattern('dd MMM yyyy - HH:mm'))}">Match Date</h6>
        </div>

        <div class="match-container">
          <div class="match-row">
            <div class="team">
              <img th:src="@{{logo}(logo=${match.matchClubStats[0].club.clubLogoPath})}" alt="Home Logo">
              <span th:text="${match.matchClubStats[0].club.clubName}">Home Club</span>
            </div>

            <div class="score" th:text="${match.matchClubStats[0].matchClubStatScore} + ' - ' + ${match.matchClubStats[1].matchClubStatScore}">
              1 - 2
            </div>

            <div class="team text-end">
              <span th:text="${match.matchClubStats[1].club.clubName}">Away Club</span>
              <img th:src="@{{logo}(logo=${match.matchClubStats[1].club.clubLogoPath})}" alt="Away Logo">
            </div>
          </div>
          <div class="venue-info">
            <span>
              📍
              <span th:text="${match.matchClubStats[0].club.clubStadium}">Sân Mỹ Đình</span>
            </span>
            <span>
              🧍‍♂️
              <span th:text="'Sức chứa: ' + ${match.matchClubStats[0].club.clubStadiumCapacity}">Sức chứa: 30,000</span>
            </span>
          </div>
        </div>
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
